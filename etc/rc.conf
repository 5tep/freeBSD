# /etc/rc.conf

# ===== BASIC SYSTEM =====
hostname="testubilling"
dumpdev="AUTO"
fsck_y_enable="YES"
background_fsck="NO"

# ===== NETWORK INTERFACES =====
# Physical interfaces
ifconfig_ix0="mtu 9000 up"                    # WAN 10G
ifconfig_ix1="inet 10.10.10.11/24 mtu 9000 up" # LAN
ifconfig_re0="up"                             # Mgmt 1G

# VLAN interfaces
cloned_interfaces="vlan270 vlan4050 vlan4000"
ifconfig_vlan270="inet 85.115.202.4/28 vlan 270 vlandev ix0 up"
ifconfig_vlan4050="inet 172.31.255.3/24 vlan 4050 vlandev ix0 mtu 9000 up"
ifconfig_vlan4000="inet 192.168.168.9/24 vlan 4000 vlandev re0 up"

# Default router (WAN)
defaultrouter="85.115.202.1"
gateway_enable="YES"

# Static routes (как было; гейтвей LAN=10.10.10.1, WAN=85.115.202.1)
static_routes="123 168 realip realip1 realip2 17250 17230 17229 1012 108 107 106 105 109 17270 17260"
route_123="-net 10.123.0.0/21 10.10.10.1"  # LAN гейт
#route_172="-net 172.16.0.0/12 10.10.10.1"
route_168="-net 192.168.0.0/16 10.10.10.1"
route_realip="-net 91.214.179.0/29 10.10.10.1"
route_realip1="-net 91.214.179.96/29 10.10.10.1"
route_realip2="-net 31.41.108.16/28 10.10.10.1"
route_17250="-net 172.16.50.0/24 85.115.202.1"  # WAN гейт
route_17230="-net 172.16.30.0/24 85.115.202.1"
route_17229="-net 172.16.29.0/24 85.115.202.1"
route_17260="-net 172.16.60.0/24 85.115.202.1"
route_1012="-net 10.10.12.0/24 85.115.202.1"
route_108="-net 10.10.8.0/24 85.115.202.1"
route_107="-net 10.10.7.0/24 85.115.202.1"
route_106="-net 10.10.6.0/24 85.115.202.1"
route_105="-net 10.10.5.0/24 85.115.202.1"
route_109="-net 10.10.9.0/24 85.115.202.1"
route_17270="-net 172.16.70.0/24 85.115.202.1"

# ===== FIREWALL & TRAFFIC SHAPING =====
# PF Firewall (main firewall)
pf_enable="YES"
pf_rules="/etc/pf.conf"
pflog_enable="YES"

# IPFW + Dummynet (for traffic shaping only)
firewall_enable="NO"                          # Disable IPFW as main firewall
ipfw_enable="YES"                             # Enable IPFW for dummynet only
ipfw_rules=""                                 # Empty rules - managed by scripts
ipfw_flags="-q"
dummynet_enable="YES"

# ===== SERVICES =====
# SSH
sshd_enable="YES"

# NTP
ntpd_enable="YES"
ntpd_sync_on_start="YES"

# Monitoring
snmpd_enable="YES"
snmpd_flags="-a"
snmpd_conffile="/usr/local/etc/snmpd.config"

# Web
nginx_enable="YES"

# Bandwidth monitoring
bandwidthd_enable="YES"

# Billing
rscriptd_enable="YES"

# ===== DISABLED SERVICES =====
moused_nondefault_enable="NO"
sendmail_enable="NO"
sendmail_submit_enable="NO"
sendmail_outbound_enable="NO"
sendmail_msp_queue_enable="NO"

# Netflow (softflowd) — на ix1 (LAN, где пользователи)
# Добавь в /etc/rc.local: /usr/local/sbin/softflowd -i ix1 -n 192.168.168.10:42111 &
#softflowd_enable="YES"
